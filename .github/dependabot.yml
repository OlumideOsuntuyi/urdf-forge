version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      three:
        patterns: ["three", "@types/three"]
      dev-tooling:
        dependency-type: development
    open-pull-requests-limit: 8
    ignore:
      # typescript-eslint does not support TypeScript 7 yet; the bump fails npm ci.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
